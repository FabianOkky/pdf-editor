# Full stack: Laravel web app + queue worker + Python pdf-service + PostgreSQL (pgvector).
#
# One-time setup:
#   cp .env.example .env           # then set APP_KEY, PDF_SERVICE_SECRET, DB_PASSWORD
#   docker compose build
#   docker compose up -d
#   docker compose exec app php artisan migrate
#
# The app is served at http://localhost:${APP_PORT:-8080}. Inside the network, services
# reach each other by name: db:5432 and http://pdf-service:8001.

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pdf_editor}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-pdf_editor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pdf-service:
    build:
      context: ./pdf-service
    environment:
      PDF_SERVICE_SECRET: ${PDF_SERVICE_SECRET}
      PDF_SERVICE_ENV: ${APP_ENV:-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-hash}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    volumes:
      - ./pdf-service/tessdata:/app/tessdata
      - pdf-ocr-cache:/app/.ocr_cache
    expose:
      - "8001"
    restart: unless-stopped

  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-pdf_editor}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      FILESYSTEM_DISK: local
      PDF_SERVICE_URL: http://pdf-service:8001
    volumes:
      - app-storage:/var/www/html/storage/app
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      pdf-service:
        condition: service_started
    restart: unless-stopped

  queue:
    build:
      context: .
    command: php artisan queue:work --sleep=3 --tries=1 --timeout=600
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-pdf_editor}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      PDF_SERVICE_URL: http://pdf-service:8001
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      pdf-service:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
  app-storage:
  pdf-ocr-cache:
