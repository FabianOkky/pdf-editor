server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Uploads can be up to PDF_MAX_UPLOAD_MB (default 25) — leave headroom.
    client_max_body_size 32M;

    # Serve ES module assets (e.g. PDF.js's `.mjs` worker) with a JavaScript MIME type.
    # The default mime.types maps `.js` but not `.mjs`, and browsers reject module scripts/
    # workers served as application/octet-stream ("Strict MIME type checking").
    location ~ \.mjs$ {
        types { } default_type text/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
